name: Commercial foundation CI

on:
  push:
    branches: [commercial-foundation]
  pull_request:
    branches: [main, commercial-foundation]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build:web
      - run: npm run build:api
